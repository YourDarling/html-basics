<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Основы HTML — интерактивный учебник</title>
<style>
  :root {
    /* MARATHON-палитра: бумажная база, графит, функциональные акценты. */
    --bg: #e9e3d3;        /* тёплый off-white / бумага */
    --panel: #efe9da;     /* светлая панель (карточки) */
    --panel-2: #ded6c1;   /* нажатое / активное */
    --accent: #ff3b2f;    /* коралл/алый — действия, активное */
    --accent-2: #00a39c;  /* циан-бирюза — метки, ссылки */
    --acid: #ece300;      /* кислотно-жёлтый — hazard, сигнал */
    --code: #ff3b2f;      /* акцент инлайн-кода */
    --text: #15140d;      /* графитово-чёрный — текст и линии */
    --muted: #6d6a5c;     /* бетонно-серый (читаемый на бумаге) */
    --border: #15140d;    /* жёсткие чёрные края */
    --code-bg: #15140d;   /* тёмная рабочая зона (редактор, код) */
    --note-bg: #efe9da;
    --radius: 0;          /* резкие края — без скругления */
    --mono: "Consolas", "SF Mono", "JetBrains Mono", "Courier New", monospace;
    --display: "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
    --chip-bg: #ffffff;   /* фон инлайн-кода (светлая тема) */
  }

  /* Тёмная тема — та же айдентика в негативе: графит-база,
     тёплый off-white текст и линии, те же сигнальные акценты. */
  :root[data-theme="dark"] {
    --bg: #14130c;        /* графитовая база */
    --panel: #201e15;     /* панель чуть светлее базы */
    --panel-2: #2b2819;   /* нажатое / активное */
    --accent: #ff4a3d;    /* коралл (чуть ярче на тёмном) */
    --accent-2: #1ac6bd;  /* циан-бирюза ярче */
    --acid: #d8b000;      /* приглушённый янтарный — мягче для глаз в тёмной теме */
    --code: #ff4a3d;
    --text: #ece6d4;      /* тёплый off-white — текст и линии */
    --muted: #9a9684;     /* бетон светлее для читаемости */
    --border: #ece6d4;    /* жёсткие светлые края */
    --code-bg: #0b0a06;   /* самая тёмная рабочая зона */
    --note-bg: #201e15;
    --chip-bg: #26241a;   /* фон инлайн-кода (тёмная тема) */
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    font-size: 16px;
  }

  /* ---------- Шапка ---------- */
  header.top {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 24px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 20;
  }
  header.top .logo {
    font-family: var(--mono);
    font-weight: 700;
    font-size: 1.25rem;
    color: var(--accent);
    letter-spacing: -1px;
  }
  header.top h1 {
    font-size: 1.1rem;
    font-weight: 600;
    margin: 0;
  }
  header.top .sub {
    margin-left: auto;
    color: var(--muted);
    font-size: .85rem;
  }

  /* ---------- Сетка ---------- */
  .layout {
    display: grid;
    grid-template-columns: 250px 1fr;
    flex: 1;
    min-height: 0;
  }

  /* ---------- Левая панель ---------- */
  nav.lessons {
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 18px 10px;
    overflow-y: auto;
  }
  nav.lessons h2 {
    font-size: .72rem;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--muted);
    margin: 4px 12px 12px;
    font-weight: 600;
  }
  .lesson-btn {
    display: flex;
    align-items: center;
    gap: 11px;
    width: 100%;
    text-align: left;
    background: transparent;
    color: var(--text);
    border: none;
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: .92rem;
    margin-bottom: 2px;
    transition: background .15s;
  }
  .lesson-btn:hover { background: var(--panel-2); }
  .lesson-btn.active {
    background: var(--panel-2);
    box-shadow: inset 3px 0 0 var(--accent);
    color: #fff;
  }
  .lesson-btn .num {
    width: 24px;
    height: 24px;
    flex: none;
    display: grid;
    place-items: center;
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: var(--mono);
    font-size: .78rem;
    color: var(--muted);
  }
  .lesson-btn.active .num {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ---------- Контент ---------- */
  main.content {
    padding: 28px 36px 70px;
    overflow-y: auto;
  }
  .wrap { max-width: 1160px; margin: 0 auto; }
  .lesson-head h2 {
    font-size: 1.7rem;
    font-weight: 700;
    margin: 0 0 4px;
  }
  .lesson-head .tagline {
    color: var(--muted);
    margin: 0 0 22px;
    font-size: 1rem;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 26px;
    margin-bottom: 18px;
  }
  .card h3 { margin-top: 0; font-size: 1.15rem; font-weight: 600; }
  .card p { line-height: 1.65; }
  .card ul { line-height: 1.7; }
  code.inline {
    background: var(--code-bg);
    border: 1px solid var(--border);
    padding: 1px 6px;
    border-radius: 5px;
    font-family: var(--mono);
    color: var(--code);
    font-size: .88em;
  }
  .note {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    background: var(--note-bg);
    border: 1px solid #1f3a5f;
    border-left: 3px solid var(--accent);
    padding: 13px 16px;
    border-radius: 8px;
    margin: 16px 0;
  }
  .note .label {
    font-size: .68rem;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--accent);
    text-transform: uppercase;
    flex: none;
    padding-top: 2px;
    min-width: 92px;
  }
  .note p { margin: 0; line-height: 1.55; }
  .tag-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  .tag-table td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .tag-table tr:last-child td { border-bottom: none; }
  .tag-table td:first-child { white-space: nowrap; width: 1%; }

  /* ---------- Песочница ---------- */
  .sandbox {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 20px;
  }
  .editor-pane, .preview-pane {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 480px;
  }
  .pane-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    font-size: .8rem;
    color: var(--muted);
    font-family: var(--mono);
  }
  .pane-bar .dot { width: 11px; height: 11px; border-radius: 50%; }
  .dot.r { background: #ff5f56; } .dot.y { background: #ffbd2e; } .dot.g { background: #27c93f; }
  textarea.editor {
    flex: 1;
    width: 100%;
    border: none;
    resize: none;
    background: var(--code-bg);
    color: #c9d1d9;
    font-family: var(--mono);
    font-size: .92rem;
    line-height: 1.6;
    padding: 16px;
    outline: none;
    tab-size: 2;
  }
  .preview-pane iframe {
    flex: 1;
    width: 100%;
    border: none;
    background: #fff;
  }
  .sandbox-toolbar {
    grid-column: 1 / -1;
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .btn {
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: .9rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: filter .15s, background .15s;
  }
  .btn-run {
    background: var(--accent-2);
    color: #0d1117;
  }
  .btn-run:hover { filter: brightness(1.1); }
  .btn-ghost {
    background: transparent;
    color: var(--text);
    border-color: var(--border);
  }
  .btn-ghost:hover { background: var(--panel-2); }
  .btn:disabled { opacity: .4; cursor: default; }
  .hint {
    color: var(--muted);
    font-size: .82rem;
    margin-left: auto;
    font-family: var(--mono);
  }

  /* Блок с готовым кодом внутри теории (не редактируемый). */
  .code-block {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    margin: 10px 0 0;
    overflow: auto;
    font-family: var(--mono);
    font-size: .85rem;
    color: #c9d1d9;
  }

  /* ---------- Схема семантики ---------- */
  .page-map { margin: 4px 0; }
  .pm-box { border: 1px solid var(--accent); border-radius: 6px; padding: 9px; margin: 6px 0; text-align: center; font-family: var(--mono); font-size: .9rem; background: rgba(88,166,255,.06); }
  .pm-row { display: flex; gap: 8px; }
  .pm-main { flex: 1; }
  .pm-aside { width: 170px; }
  .pm-article { border: 1px dashed var(--muted); border-radius: 6px; padding: 7px; margin: 6px; font-family: var(--mono); font-size: .85rem; }
  .pm-small { font-size: .78rem; color: var(--muted); font-family: var(--mono); }

  /* ---------- Низ ---------- */
  .lesson-nav {
    display: flex;
    justify-content: space-between;
    margin-top: 6px;
  }
  footer.foot {
    text-align: center;
    padding: 14px;
    color: var(--muted);
    font-size: .8rem;
    border-top: 1px solid var(--border);
  }

  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    /* На узком экране список уроков свёрнут в одну кнопку (.lessons-toggle):
       17 кнопок иначе занимают полэкрана над уроком. */
    nav.lessons { padding: 10px 12px; }
    nav.lessons h2 { display: none; }
    .lesson-btn { display: none; }
    nav.lessons.open .lesson-btn { display: flex; }
    main.content { padding: 20px 16px 50px; }
    .sandbox { grid-template-columns: 1fr; }
    .editor-pane, .preview-pane { min-height: 340px; }
    .note .label { min-width: 0; }
  }

  /* ============================================================
     MARATHON SKIN — визуальный протокол поверх базовой разметки.
     Бумага + графит, жёсткие края, капслок-гротеск, color-blocking.
     ============================================================ */

  body { font-family: Arial, "Helvetica Neue", Helvetica, sans-serif; }

  /* Жёсткие края везде — никакого скругления. */
  .card, .note, .btn, .lesson-btn, .lesson-btn .num, code.inline,
  .code-block, .editor-pane, .preview-pane, .pm-box, .pm-article,
  .pane-bar .dot, .logo, .reg { border-radius: 0 !important; }

  /* --- Hazard-штриховка: сигнальная полоса-разделитель. --- */
  /* Hazard-лента всегда чёрно-жёлтая (и в светлой, и в тёмной теме):
     чёрный отделяет жёлтый, поэтому не рябит. #15140d — фикс. графит. */
  .hazard {
    height: 10px;
    background: repeating-linear-gradient(45deg,
      #15140d 0 14px, var(--acid) 14px 28px);
    border-bottom: 2px solid var(--text);
  }

  /* --- Шапка --- */
  header.top { gap: 16px; border-bottom: none; }
  .logo {
    background: var(--text);
    color: var(--bg);
    font-family: var(--display);
    font-weight: 800;
    letter-spacing: .5px;
    padding: 5px 10px;
    font-size: 1.1rem;
    border: 2px solid var(--text);
  }
  .brandline { display: flex; flex-direction: column; line-height: 1.12; }
  header.top h1 {
    font-family: var(--display);
    text-transform: uppercase;
    font-weight: 800;
    letter-spacing: .3px;
    font-size: 1.35rem;
  }
  header.top .sub {
    margin: 0;
    font-family: var(--mono);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-size: .7rem;
    color: var(--accent-2);
  }
  .reg {
    font-family: var(--mono);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-size: .7rem;
    color: var(--accent);
    border: 1px solid var(--text);
    padding: 4px 8px;
    white-space: nowrap;
  }

  /* Переключатель темы — служебная кнопка, толкается к правому краю. */
  .theme-toggle {
    margin-left: auto;
    font-family: var(--mono);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-size: .7rem;
    color: var(--text);
    background: var(--bg);
    border: 2px solid var(--text);
    padding: 4px 10px;
    cursor: pointer;
    border-radius: 0;
    white-space: nowrap;
  }
  .theme-toggle:hover { background: var(--acid); color: #15140d; }   /* тёмный текст на жёлтом */
  .theme-toggle + .reg { margin-left: 10px; }

  /* --- Боковое меню --- */
  nav.lessons { border-right: 2px solid var(--text); }
  nav.lessons h2 { font-family: var(--mono); color: var(--text); }
  nav.lessons h2::before { content: "// "; color: var(--accent); }
  .lesson-btn { border: 1px solid transparent; font-weight: 600; }
  .lesson-btn.active {
    background: var(--bg);
    color: var(--text);
    box-shadow: none;
    border: 1px solid var(--text);
    border-left: 5px solid var(--accent);
  }
  .lesson-btn .num {
    background: var(--text);
    color: var(--bg);
    border: none;
    font-weight: 700;
  }
  .lesson-btn.active .num { background: var(--accent); color: var(--bg); }

  /* --- Заголовок урока --- */
  .lesson-head h2 {
    font-family: var(--display);
    text-transform: uppercase;
    letter-spacing: .2px;
    font-size: 2rem;
    border-left: 8px solid var(--accent);
    padding-left: 14px;
  }
  .lesson-head .tagline {
    font-family: var(--mono);
    text-transform: uppercase;
    letter-spacing: .5px;
    font-size: .78rem;
    color: var(--muted);
    padding-left: 14px;
  }

  /* --- Карточки + реги-крест в углу («протокольная» метка). --- */
  .card { border: 2px solid var(--text); position: relative; }
  .card::after {
    content: "+";
    position: absolute;
    top: 5px; right: 9px;
    font-family: var(--mono);
    color: var(--accent-2);
    font-size: .95rem;
    line-height: 1;
  }
  .card h3 {
    font-family: var(--display);
    text-transform: uppercase;
    letter-spacing: .3px;
    font-size: 1.25rem;
  }

  /* Инлайн-код — светлый чип с жёсткой рамкой. */
  code.inline { background: var(--chip-bg); border: 1px solid var(--text); color: var(--text); }

  /* Блок готового кода — тёмная рабочая зона. */
  .code-block { border: 2px solid var(--text); color: #e9e3d3; }

  /* --- Заметки-callout --- */
  .note { background: var(--panel); border: 2px solid var(--text); border-left: 6px solid var(--accent); }
  .note .label { font-family: var(--mono); color: var(--accent); }

  /* --- Таблицы тегов --- */
  .tag-table td { border-bottom: 1px solid var(--text); }
  .tag-table td:first-child { font-weight: 700; }

  /* --- Песочница --- */
  .editor-pane, .preview-pane { border: 2px solid var(--text); }
  .pane-bar {
    background: var(--text);
    color: var(--bg);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .pane-bar .dot { width: 10px; height: 10px; }

  /* Вкладки файлов: активная «вырезана» из бара цветом страницы
     и подчёркнута кораллом — читается в обеих темах. */
  .file-tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-left: 8px; }
  .file-tab {
    background: transparent;
    color: inherit;
    border: none;
    border-radius: 0;
    font: inherit;
    text-transform: inherit;
    letter-spacing: inherit;
    padding: 3px 9px;
    cursor: pointer;
    opacity: .65;
  }
  .file-tab:hover { opacity: 1; }
  .file-tab.active {
    opacity: 1;
    background: var(--bg);
    color: var(--text);
    box-shadow: inset 0 -3px 0 var(--accent);
  }

  /* Подписи «плохо / хорошо» над примерами кода в уроках про кодстайл. */
  .code-caption {
    margin: 16px 0 0;
    font-family: var(--mono);
    font-size: .75rem;
    font-weight: 700;
    letter-spacing: .5px;
    text-transform: uppercase;
  }
  .code-caption-bad  { color: var(--accent); }
  .code-caption-good { color: var(--accent-2); }

  /* Последний абзац карточки — без нижнего отступа (вместо style="…"). */
  .card > p:last-child { margin-bottom: 0; }

  /* --- Картинки «в папке проекта» под редактором --- */
  .asset-strip {
    grid-column: 1 / -1;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px;
    padding: 10px 12px;
    border: 2px dashed var(--text);
  }
  .asset-label {
    font-family: var(--mono);
    font-size: .72rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--accent);
  }
  .asset { margin: 0; display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: .8rem; }
  .asset img { width: 54px; height: 36px; object-fit: cover; border: 2px solid var(--text); background: #fff; }

  /* --- Схема блочной модели: слои коробки цветными зонами --- */
  .box-model { margin: 14px 0 18px; font-family: var(--mono); font-size: .75rem; text-transform: uppercase; letter-spacing: .5px; }
  .bm-label { display: block; margin-bottom: 8px; }
  .bm-margin { border: 2px dashed var(--muted); padding: 12px 16px 16px; color: var(--text); }
  .bm-border { border: 8px solid var(--text); }
  .bm-label-dark { margin: 0; padding: 3px 8px; background: var(--text); color: var(--bg); }
  .bm-padding { background: var(--accent-2); color: #15140d; padding: 12px 18px 18px; }
  .bm-content { background: var(--accent); color: #fff; padding: 16px; text-align: center; font-weight: 700; }

  /* --- Пульт flexbox --- */
  .flex-demo {
    display: flex;
    gap: 8px;
    height: 200px;
    margin: 14px 0;
    padding: 8px;
    border: 2px solid var(--text);
    background: var(--bg);
  }
  .fd-item {
    min-width: 60px;
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--display);
    font-size: 1.4rem;
    font-weight: 800;
    color: #15140d;
    border: 2px solid #15140d;
  }
  .fd-item:nth-child(1) { background: var(--accent); }
  .fd-item:nth-child(2) { background: var(--accent-2); }
  .fd-item:nth-child(3) { background: var(--acid); }
  .flex-demo[data-flex-direction="column"]       { flex-direction: column; }
  .flex-demo[data-justify-content="center"]       { justify-content: center; }
  .flex-demo[data-justify-content="flex-end"]     { justify-content: flex-end; }
  .flex-demo[data-justify-content="space-between"] { justify-content: space-between; }
  .flex-demo[data-justify-content="space-around"]  { justify-content: space-around; }
  .flex-demo[data-align-items="flex-start"]       { align-items: flex-start; }
  .flex-demo[data-align-items="center"]           { align-items: center; }
  .flex-demo[data-align-items="flex-end"]         { align-items: flex-end; }
  .fd-controls { display: grid; gap: 8px; }
  .fd-group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .fd-label {
    min-width: 140px;
    font-family: var(--mono);
    font-size: .72rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--accent);
  }
  .fd-group button {
    padding: 4px 10px;
    font-family: var(--mono);
    font-size: .78rem;
    color: var(--text);
    background: var(--bg);
    border: 2px solid var(--text);
    border-radius: 0;
    cursor: pointer;
  }
  .fd-group button:hover { background: var(--panel-2); }
  .fd-group button.active { background: var(--text); color: var(--bg); }
  .dot.r { background: var(--accent); }
  .dot.y { background: var(--acid); }

/* ============================================================
   ЛОГИКА ПРИЛОЖЕНИЯ
   ============================================================ */

/* Короткий помощник: элемент по id. */
const $ = (id) => document.getElementById(id);

/* Индекс открытого урока. Меняется только через goTo(),
   которая удерживает его в границах списка. */
let currentIndex = 0;

/* --- Боковое меню ---------------------------------------- */

/* Строим список уроков ОДИН раз при запуске: сами кнопки не меняются,
   меняется только их подсветка (см. setActiveButton). */
function buildSidebar() {
  const nav = $("lessonList");
  LESSONS.forEach((lesson, i) => {
    const btn = document.createElement("button");
    btn.className = "lesson-btn";
    btn.dataset.index = i;
    btn.innerHTML = `<span class="num">${i + 1}</span><span>${lesson.title}</span>`;
    btn.addEventListener("click", () => goTo(i));
    nav.appendChild(btn);
  });
}

/* Подсвечиваем кнопку текущего урока, снимая подсветку с остальных. */
function setActiveButton(index) {
  document.querySelectorAll(".lesson-btn").forEach((btn) => {
    btn.classList.toggle("active", Number(btn.dataset.index) === index);
  });
}

/* --- Отрисовка урока ------------------------------------- */

/* Собираем разметку урока: теория + песочница + кнопки навигации.
   Возвращаем строку, которую вставляем в контейнер за один раз. */
function buildLessonMarkup(lesson, index) {
  const isFirst = index === 0;
  const isLast = index === LESSONS.length - 1;
  const fileNames = Object.keys(lessonFiles(lesson));
  // Один файл — просто подпись; несколько — вкладки для переключения.
  const fileLabels = fileNames.length > 1
    ? fileNames.map((name, i) =>
        `<button type="button" class="file-tab${i === 0 ? " active" : ""}" data-file="${name}">${name}</button>`
      ).join("")
    : `<span class="file-name">${fileNames[0]}</span>`;
  // Картинки из «папки проекта» показываем миниатюрами под редактором.
  const assets = Object.entries(lesson.assets || {});
  const assetStrip = assets.length
    ? `<div class="asset-strip"><span class="asset-label">// Картинки в папке проекта</span>${
        assets.map(([name, svg]) =>
          `<figure class="asset"><img src="${svgDataUri(svg)}" alt="${name}"><figcaption>${name}</figcaption></figure>`
        ).join("")}</div>`
    : "";
  return `
    <div class="lesson-head">
      <h2>${lesson.title}</h2>
      <p class="tagline">Урок ${index + 1} из ${LESSONS.length} · ${lesson.tagline}</p>
    </div>
    ${lesson.html}
    <div class="card">
      <h3>Редактор кода</h3>
      <p>Меняй код слева и нажимай «Запустить» — результат появится справа.</p>
    </div>
    <div class="sandbox">
      <div class="editor-pane">
        <div class="pane-bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="file-tabs">${fileLabels}</span></div>
        <textarea class="editor" id="editor" spellcheck="false"></textarea>
      </div>
      <div class="preview-pane">
        <div class="pane-bar">Результат</div>
        <iframe id="preview" title="Результат"></iframe>
      </div>
      ${assetStrip}
      <div class="sandbox-toolbar">
        <button class="btn btn-run" id="runBtn">Запустить</button>
        <button class="btn btn-ghost" id="resetBtn">Сбросить</button>
        <span class="hint">Ctrl + Enter — запуск</span>
      </div>
    </div>
    <div class="lesson-nav">
      <button class="btn btn-ghost" id="prevBtn" ${isFirst ? "disabled" : ""}>← Назад</button>
      <button class="btn btn-run" id="nextBtn" ${isLast ? "disabled" : ""}>Дальше →</button>
    </div>
  `;
}

/* Подключаем песочницу: кладём в редактор пример урока и вешаем обработчики.
   Поле и кнопки создаются заново при каждой отрисовке урока, поэтому и
   обработчики вешаем заново — старые уходят вместе со старыми узлами. */
function setupSandbox(lesson) {
  const editor = $("editor");
  const original = lessonFiles(lesson);
  let files = { ...original };     // правки ученика по каждому файлу
  let activeFile = "index.html";
  editor.value = files[activeFile];

  // Правки сохраняем сразу, чтобы они не терялись при переключении вкладок.
  editor.addEventListener("input", () => { files[activeFile] = editor.value; });

  const showFile = (name) => {
    activeFile = name;
    editor.value = files[name];
    document.querySelectorAll(".file-tab").forEach((tab) => {
      tab.classList.toggle("active", tab.dataset.file === name);
    });
  };
  document.querySelectorAll(".file-tab").forEach((tab) => {
    tab.addEventListener("click", () => showFile(tab.dataset.file));
  });

  const run = () => runCode(buildDocument(files, lesson.previewCss, lesson.assets));
  $("runBtn").addEventListener("click", run);
  $("resetBtn").addEventListener("click", () => {
    files = { ...original };      // вернуть исходные примеры всех файлов урока
    editor.value = files[activeFile];
    run();
  });

  editor.addEventListener("keydown", (e) => {
    // Ctrl/Cmd + Enter — быстрый запуск без вставки перевода строки.
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
      e.preventDefault();
      run();
      return;
    }
    const start = editor.selectionStart;
    const lineStart = editor.value.lastIndexOf("\n", start - 1) + 1;

    // Shift+Tab убирает до двух пробелов в начале текущей строки.
    if (e.key === "Tab" && e.shiftKey) {
      e.preventDefault();
      const removable = editor.value.slice(lineStart, lineStart + 2).match(/^ {1,2}/);
      if (!removable) return;
      const n = removable[0].length;
      editor.setSelectionRange(lineStart, lineStart + n);
      insertText(editor, "");
      const caret = Math.max(lineStart, start - n);
      editor.setSelectionRange(caret, caret);
      return;
    }
    // Tab вставляет два пробела, а не уводит фокус с поля.
    if (e.key === "Tab") {
      e.preventDefault();
      insertText(editor, "  ");
      return;
    }
    // Enter переносит строку с тем же отступом, что у текущей, —
    // так проще держать «лесенку» вложенности.
    if (e.key === "Enter" && !e.ctrlKey && !e.metaKey) {
      e.preventDefault();
      const indent = editor.value.slice(lineStart).match(/^ */)[0];
      insertText(editor, "\n" + indent);
    }
  });

  run();   // сразу показываем результат примера
}

/* Подключаем кнопки «Назад» / «Дальше» текущего урока. */
function setupLessonNav(index) {
  $("prevBtn").addEventListener("click", () => goTo(index - 1));
  $("nextBtn").addEventListener("click", () => goTo(index + 1));
}

/* Открыть урок по индексу — единственная точка смены урока.
   Здесь же держим индекс в границах списка. */
function goTo(index) {
  if (index < 0 || index >= LESSONS.length) return;   // вне диапазона — игнорируем
  currentIndex = index;

  const lesson = LESSONS[index];
  $("content").innerHTML = buildLessonMarkup(lesson, index);

  setupSandbox(lesson);
  setupLessonNav(index);
  setActiveButton(index);
  if (lesson.onMount) lesson.onMount();   // интерактив внутри теории (демка flexbox)

  // Кнопка меню на телефоне показывает текущий урок; после выбора список сворачиваем.
  $("lessonsToggleTitle").textContent = `${index + 1}. ${lesson.title}`;
  setLessonsOpen(false);

  // Новый урок — к началу. На компьютере прокручивается колонка урока,
  // на телефоне — вся страница, поэтому сбрасываем обе.
  document.querySelector("main.content").scrollTop = 0;
  window.scrollTo(0, 0);
}

/* Раскрыть / свернуть список уроков (кнопка видна только на узком экране). */
function setLessonsOpen(open) {
  $("lessonList").classList.toggle("open", open);
  $("lessonsToggle").setAttribute("aria-expanded", String(open));
}

/* --- Песочница ------------------------------------------- */

/* Вставка текста в поле на место выделения. execCommand сохраняет
   историю правок, поэтому Ctrl+Z продолжает работать; если браузер
   его не поддерживает — вставляем напрямую (без истории). Событие input
   нужно, чтобы правка попала в файл активной вкладки. */
function insertText(field, text) {
  field.focus();
  let ok = false;
  try { ok = document.execCommand("insertText", false, text); } catch (e) { ok = false; }
  if (!ok) {
    field.setRangeText(text, field.selectionStart, field.selectionEnd, "end");
    field.dispatchEvent(new Event("input"));
  }
}

/* SVG-текст → data:-адрес. Кроме обычного кодирования экранируем
   кавычку и скобки, чтобы адрес не ломал url("…") в CSS. */
function svgDataUri(svg) {
  return "data:image/svg+xml," + encodeURIComponent(svg)
    .replace(/'/g, "%27").replace(/\(/g, "%28").replace(/\)/g, "%29");
}

/* Пульт flexbox в уроке «Flexbox». Значения храним в data-атрибутах
   контейнера, а раскладку делают CSS-правила .flex-demo[data-…] —
   так демка сама не пользуется атрибутом style. */
function setupFlexDemo() {
  const demo = $("flexDemo");
  const codeEl = $("flexCode");
  if (!demo || !codeEl) return;

  const state = { "flex-direction": "row", "justify-content": "flex-start", "align-items": "stretch" };
  const render = () => {
    Object.entries(state).forEach(([prop, value]) => demo.setAttribute("data-" + prop, value));
    codeEl.textContent = ".container {\n  display: flex;\n" +
      Object.entries(state).map(([prop, value]) => `  ${prop}: ${value};`).join("\n") + "\n}";
  };

  document.querySelectorAll(".fd-group").forEach((group) => {
    group.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-value]");
      if (!btn) return;
      state[group.dataset.prop] = btn.dataset.value;
      group.querySelectorAll("button").forEach((b) => b.classList.toggle("active", b === btn));
      render();
    });
  });
  render();
}

/* Все файлы урока: index.html (lesson.code) + дополнительные (lesson.files). */
function lessonFiles(lesson) {
  return { "index.html": lesson.code, ...(lesson.files || {}) };
}

/* Собираем одну страницу для окна результата. В песочнице нет настоящих
   файлов, поэтому <link href="style.css"> и <script src="script.js"> заменяем
   содержимым соответствующих вкладок. Подставляем только то, что реально
   подключено: удалил <link> — стили пропали, как и в настоящем проекте. */
function buildDocument(files, previewCss, assets) {
  let html = files["index.html"];

  html = html.replace(/<link\b[^>]*>/gi, (tag) => {
    const href = (tag.match(/\bhref\s*=\s*["']([^"']+)["']/i) || [])[1];
    const isStylesheet = /\brel\s*=\s*["']?stylesheet/i.test(tag);
    return isStylesheet && href in files ? `<style>${files[href]}</style>` : tag;
  });

  html = html.replace(/<script\b[^>]*\bsrc\s*=\s*["']([^"']+)["'][^>]*>\s*<\/script>/gi,
    (tag, src) => (src in files ? `<script>${files[src]}<\/script>` : tag));

  // Картинки проекта: url("stars.svg") в CSS и src="photo.svg" в HTML
  // заменяем встроенными файлами. Неизвестные имена не трогаем.
  Object.entries(assets || {}).forEach(([name, svg]) => {
    const uri = svgDataUri(svg);
    const escaped = name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    html = html
      .replace(new RegExp(`url\\(\\s*["']?${escaped}["']?\\s*\\)`, "g"), () => `url("${uri}")`)
      .replace(new RegExp(`(\\bsrc\\s*=\\s*)["']${escaped}["']`, "g"), (m, attr) => `${attr}"${uri}"`);
  });

  // Служебные стили учебника (например, рамки в уроке про структуру):
  // кладём в <head>, если он есть, иначе в начало фрагмента.
  if (previewCss) {
    const helper = `<style>${previewCss}</style>`;
    html = /<\/head>/i.test(html)
      ? html.replace(/<\/head>/i, () => helper + "</head>")
      : helper + html;
  }
  return html;
}

/* Запуск кода пользователя в изолированном iframe.
   allow-scripts без allow-same-origin: JS выполняется, но не имеет
   доступа к странице учебника. Грузим через data:-URL (а не srcdoc),
   чтобы якорные ссылки (#id) прокручивали сам пример,
   а не адрес файла учебника. */
function runCode(code) {
  const frame = $("preview");
  frame.removeAttribute("srcdoc");
  frame.setAttribute("sandbox", "allow-scripts allow-popups allow-popups-to-escape-sandbox");
  frame.src = "data:text/html;charset=utf-8," + encodeURIComponent(code);
}

/* --- Тема: светлая / тёмная ------------------------------ */

const THEME_KEY = "html_course_theme";

/* Применяем тему к документу и обновляем подпись кнопки.
   Подпись показывает, КУДА переключит клик (не текущее состояние). */
function applyTheme(theme) {
  const root = document.documentElement;
  if (theme === "dark") {
    root.setAttribute("data-theme", "dark");
  } else {
    root.removeAttribute("data-theme");   // светлая — состояние по умолчанию
  }
  const btn = $("themeToggle");
  if (btn) btn.textContent = theme === "dark" ? "☀ СВЕТ" : "☾ ТЬМА";
}

/* Сохранённая тема; по умолчанию светлая. */
function loadTheme() {
  try {
    return localStorage.getItem(THEME_KEY) === "dark" ? "dark" : "light";
  } catch (e) {
    return "light";   // приватный режим / доступ закрыт — не падаем
  }
}

/* Подключаем кнопку переключения темы. */
function setupTheme() {
  let theme = loadTheme();
  applyTheme(theme);

  const btn = $("themeToggle");
  if (!btn) return;
  btn.addEventListener("click", () => {
    theme = theme === "dark" ? "light" : "dark";
    applyTheme(theme);
    try { localStorage.setItem(THEME_KEY, theme); } catch (e) { /* без сохранения */ }
  });
}

/* --- Запуск --------------------------------------------- */

function init() {
  // Защита от пустого списка: не падаем, а честно сообщаем.
  if (!Array.isArray(LESSONS) || LESSONS.length === 0) {
    $("content").innerHTML = "<p>Уроки не найдены.</p>";
    return;
  }
  setupTheme();
  buildSidebar();
  $("lessonsToggle").addEventListener("click", () => {
    setLessonsOpen(!$("lessonList").classList.contains("open"));
  });
  goTo(0);
}

init();
</script>
